services:
  # ─── Backend API (Node.js / Express + Prisma) ────────────────────────────
  - type: web
    name: agentmirror-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push && npm run db:seed && node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: agentmirror-db
          property: connectionString
      - key: PORT
        value: 4000
      - key: OKX_DEMO_MODE
        value: "true"
      # Add these from the Render dashboard:
      # OKX_API_KEY, OKX_API_SECRET, OKX_PASSPHRASE, OKX_PROJECT_ID, AI_API_KEY

  # ─── Frontend (Vite React SPA via static site) ────────────────────────────
  - type: web
    name: agentmirror-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: agentmirror-api
          property: host
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: agentmirror-db
    databaseName: agentmirror
    plan: free
